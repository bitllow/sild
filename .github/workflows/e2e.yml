name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Go backend unit/integration suite (the inbox+widget e2e below drives the app,
  # this covers the backend directly).
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Ahead of setup-go so the image pull overlaps the toolchain and module
      # download. A step, not a service: `services:` cannot pass container
      # arguments, and without -scheme http and a -public-host matching the host
      # we reach it on, the emulator serves reads its clients cannot resolve.
      - name: Start GCS emulator
        run: |
          docker run -d --name fake-gcs -p 4443:4443 fsouza/fake-gcs-server \
            -scheme http -backend memory -public-host localhost:4443

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Wait for the GCS emulator
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4443/storage/v1/b >/dev/null && exit 0
            sleep 1
          done
          echo "GCS emulator did not become ready"; docker logs fake-gcs; exit 1

      - name: go test
        working-directory: backend
        env:
          STORAGE_EMULATOR_HOST: localhost:4443
        run: go test ./...

  # The concurrency guards (assignment claim, outbox claim, job leases) need real
  # row-level contention to mean anything — SQLite serializes writers, so the
  # store suite runs again against each production dialect with racing goroutines.
  backend-tests-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sild
          POSTGRES_PASSWORD: sild
          POSTGRES_DB: sild
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sild"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go test (postgres dialect)
        working-directory: backend
        env:
          SILD_TEST_POSTGRES_DSN: "host=localhost port=5432 user=sild password=sild dbname=sild sslmode=disable"
        run: go test -race ./internal/store/gormstore/

  # MySQL is the second supported production dialect, and the outbox claim leans
  # on FOR UPDATE SKIP LOCKED there as much as on Postgres — different engine,
  # different locking implementation, so it gets its own run.
  backend-tests-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: sild
          MYSQL_DATABASE: sild
          MYSQL_USER: sild
          MYSQL_PASSWORD: sild
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -usild -psild --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go test (mysql dialect)
        working-directory: backend
        env:
          SILD_TEST_MYSQL_DSN: "sild:sild@tcp(127.0.0.1:3306)/sild?charset=utf8mb4&parseTime=True&loc=Local"
        run: go test -race ./internal/store/gormstore/

  # Browser behavior tests for the inbox + drop-in widget, run against a real
  # backend. Matrix covers both the zero-infra default (SQLite) and the primary
  # production target (Postgres, with full trigram search). Tuned for the free
  # public runners (ubuntu-latest, 2 vCPU).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sild
          POSTGRES_PASSWORD: sild
          POSTGRES_DB: sild
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sild"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            inbox/package-lock.json

      # 1. Build the widget FIRST so it is embedded into the Go binary at build.
      - name: Build widget bundle
        working-directory: web
        run: |
          npm ci
          npm run build

      # 2. Pre-build the backend (fail fast + warm the Go build cache).
      - name: Build backend
        working-directory: backend
        run: go build ./...

      # 3. Inbox dependencies (Next.js dev server).
      - name: Install inbox
        working-directory: inbox
        run: npm ci

      # 4. E2E dependencies + Chromium (only Chromium to keep the runner light).
      - name: Install e2e
        working-directory: e2e
        run: npm install --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # 5. Run the suite. webServer[] boots sild-dev against the matrix DB; the
      #    widget build above is already embedded.
      - name: Run Playwright tests
        working-directory: e2e
        run: npm test
        env:
          CI: "1"
          SILD_E2E_SKIP_BUILD: "1" # widget already built in step 1
          SILD_E2E_DB_DRIVER: ${{ matrix.db }}
          SILD_E2E_DB_DSN: ${{ matrix.db == 'postgres' && 'host=localhost port=5432 user=sild password=sild dbname=sild sslmode=disable' || '' }}

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.db }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  # The deployment suite: boots `sild-standalone` — the whole backend in one
  # process on one port — and asserts the shape a customer deploys. Its own job
  # because the binary is a production one: it requires Postgres AND Redis, has no
  # dev seed, and serves none of sild-dev's surfaces.
  e2e-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sild
          POSTGRES_PASSWORD: sild
          POSTGRES_DB: sild
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sild"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The widget bundle is embedded at compile time, and standalone serves it.
      - name: Build widget bundle
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build backend
        working-directory: backend
        run: go build ./...

      - name: Install e2e
        working-directory: e2e
        run: npm install --no-audit --no-fund

      # No browser install: this suite asserts the deployment over `request`, and
      # never opens a page.
      # webServer[] runs sild-migrate (the only thing that migrates, §4) and then
      # sild-standalone against the services above.
      - name: Run standalone deployment tests
        working-directory: e2e
        run: npm run test:standalone
        env:
          CI: "1"
          SILD_E2E_SKIP_BUILD: "1"
          SILD_E2E_DB_DSN: "host=localhost port=5432 user=sild password=sild dbname=sild sslmode=disable"
          SILD_E2E_REDIS_URL: "redis://localhost:6379"

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-standalone
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
