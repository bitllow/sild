name: android-sdk

on:
  push:
    branches: [master]
    paths:
      - "sdks/kotlin/**"
      - "sdks/swift/**"
      - "backend/**"
      - ".github/workflows/android-sdk.yml"
      # Release-workflow edits get PR CI too — its XCFramework build is this job's.
      - ".github/workflows/sdk-release.yml"
  pull_request:
    paths:
      - "sdks/kotlin/**"
      - "sdks/swift/**"
      - "backend/**"
      - ".github/workflows/android-sdk.yml"
      # Release-workflow edits get PR CI too — its XCFramework build is this job's.
      - ".github/workflows/sdk-release.yml"

jobs:
  # Build the Android SDK (core JAR + ui AAR + sample APK) and run the pure-JVM
  # core tests against a live sild-dev — the same zero-infra backend the web e2e
  # boots. No emulator: the wire contract is covered by JVM tests, the UI by
  # a successful assemble.
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sdks/kotlin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Checks the committed gradle-wrapper.jar against known Gradle checksums.
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      # Boot sild-dev (SQLite + in-memory broker) so the core integration tests
      # have a backend at :8080; wait for /healthz before running them.
      - name: Start sild-dev
        working-directory: backend
        run: |
          DB_DRIVER=sqlite DB_DSN=/tmp/sild-android-ci.db SILD_BROKER=memory \
            STORAGE_BACKEND=local SILD_ENV=development \
            go run ./cmd/sild-dev > /tmp/sild-dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/healthz && { healthy=1; break; }
            sleep 1
          done
          # Fail here, with the log, rather than as a confusing test error later.
          [ -n "$healthy" ] || {
            echo "::error::sild-dev did not become healthy within 60s"
            cat /tmp/sild-dev.log
            exit 1
          }

      - name: Core tests (against sild-dev)
        env:
          SILD_BASE_URL: http://localhost:8080
        run: ./gradlew :core:jvmTest

      # :sample:assembleRelease is minified (R8) — it validates consumer-rules.pro.
      - name: Assemble SDK (ui AAR + sample APK, debug + minified release)
        run: ./gradlew :ui:assembleRelease :sample:assembleDebug :sample:assembleRelease

      # Only the artifacts this host can produce; the Apple ones are the ios-core job's.
      - name: Publish artifacts to Maven local (smoke test packaging)
        run: ./gradlew :core:publishJvmPublicationToMavenLocal :ui:publishToMavenLocal

  # The same shared :core, compiled by Kotlin/Native and run on an iOS simulator:
  # commonTest holds the whole wire contract, so this covers the REST/auth/upload
  # logic and the live-backend integration tests on Apple as thoroughly as the sdk
  # job covers them on the JVM. macOS minutes are free for public repos.
  ios-core:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: sdks/kotlin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      # The simulator shares the runner's network, so the tests reach sild-dev on
      # localhost exactly as the JVM ones do.
      - name: Start sild-dev
        working-directory: backend
        run: |
          DB_DRIVER=sqlite DB_DSN=/tmp/sild-ios-ci.db SILD_BROKER=memory \
            STORAGE_BACKEND=local SILD_ENV=development \
            go run ./cmd/sild-dev > /tmp/sild-dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/healthz && { healthy=1; break; }
            sleep 1
          done
          # Fail here, with the log, rather than as a confusing test error later.
          [ -n "$healthy" ] || {
            echo "::error::sild-dev did not become healthy within 60s"
            cat /tmp/sild-dev.log
            exit 1
          }

      - name: Core tests on the iOS simulator (against sild-dev)
        env:
          SILD_BASE_URL: http://localhost:8080
        run: ./gradlew :core:iosSimulatorArm64Test

      # The plugin DISABLES the simulator test task when the JDK's architecture does
      # not match the target's (an x86_64 JDK on an arm64 runner), and the build still
      # reports success — so assert that tests actually ran.
      - name: Assert the simulator tests ran
        run: |
          count=$(grep -ho 'tests="[0-9]*"' core/build/test-results/iosSimulatorArm64Test/*.xml 2>/dev/null \
            | grep -o '[0-9]*' | paste -sd+ - | bc)
          [ "${count:-0}" -gt 0 ] || {
            echo "::error::no iOS simulator tests ran — the task was skipped"
            exit 1
          }
          echo "$count iOS simulator tests ran"

      # The Apple artifacts, which only a macOS host can build.
      - name: Publish artifacts to Maven local (smoke test packaging)
        run: ./gradlew :core:publishToMavenLocal

      # Everything below proves the shipping scheme: the Swift package consumes the
      # XCFramework exactly as a host app would, and its tests call through it into the
      # shared Kotlin code against the same live sild-dev.
      - name: Assemble the XCFramework
        run: ./gradlew :core:assembleSildCoreReleaseXCFramework

      # xcodebuild does not forward the job's environment into the simulator, and the
      # TEST_RUNNER_ prefix does not reach a SwiftPM-generated scheme — so publish the
      # variable on the booted device's launchd, which apps do inherit.
      - name: Boot the simulator with SILD_BASE_URL
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for v in d.values() for x in v if x['name'].startswith('iPhone')))")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl spawn "$udid" launchctl setenv SILD_BASE_URL http://localhost:8080

      - name: Swift package tests on the iOS simulator (against sild-dev)
        working-directory: sdks/swift
        # Keep in step with the tests in SildCoreSmokeTests.
        env:
          EXPECTED_TESTS: "3"
        run: |
          set -o pipefail
          xcodebuild test -scheme Sild \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            | tee /tmp/xcodebuild.log
          # One test skipping (SILD_BASE_URL never reached the simulator) must not hide
          # behind another passing, so pin the count and forbid skips outright.
          line=$(grep -E "Executed [0-9]+ test" /tmp/xcodebuild.log | tail -1)
          [ -n "$line" ] || { echo "::error::xcodebuild printed no test summary"; exit 1; }
          ran=$(sed -n 's/.*Executed \([0-9]*\) test.*/\1/p' <<<"$line")
          skipped=$(sed -n 's/.*with \([0-9]*\) test[s]* skipped.*/\1/p' <<<"$line")
          echo "ran=$ran skipped=${skipped:-0} ($line)"
          [ "$ran" = "$EXPECTED_TESTS" ] || {
            echo "::error::expected $EXPECTED_TESTS Swift tests, $ran ran"; exit 1
          }
          [ "${skipped:-0}" = "0" ] || {
            echo "::error::${skipped} Swift test(s) skipped — SILD_BASE_URL did not reach the simulator"
            exit 1
          }

      - name: Dump sild-dev log on failure
        if: failure()
        run: cat /tmp/sild-dev.log

  # End-to-end on a real emulator: launch the sample app and round-trip a support
  # message through a live sild-dev (SildMessengerE2ETest). Hardware-accelerated
  # x86_64 emulators run free on ubuntu-latest for public repos — KVM is available
  # on GitHub-hosted Linux runners and the emulator-runner action enables it. The
  # emulator reaches the runner's sild-dev at 10.0.2.2:8080 (DevBackend.BASE).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      # KVM must be writable for a hardware-accelerated emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start sild-dev
        working-directory: backend
        run: |
          DB_DRIVER=sqlite DB_DSN=/tmp/sild-android-e2e.db SILD_BROKER=memory \
            STORAGE_BACKEND=local SILD_ENV=development \
            go run ./cmd/sild-dev > /tmp/sild-dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/healthz && { healthy=1; break; }
            sleep 1
          done
          # Fail before spending ~10 minutes booting an emulator against a backend
          # that isn't there.
          [ -n "$healthy" ] || {
            echo "::error::sild-dev did not become healthy within 60s"
            cat /tmp/sild-dev.log
            exit 1
          }

      # Cache the AVD system image + snapshot so reruns skip the cold boot.
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-29

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-load
          disable-animations: true
          script: echo "Generated AVD snapshot."

      # This emulator wedges in shutdown: after the tests pass it logs
      # "Wait for emulator … before kill" and never exits, so the action's
      # teardown burns the whole job budget. The test RESULT is what gates the
      # job (asserted below), and teardown is bounded rather than trusted.
      #
      # Each `script` line runs as its own `sh -c`, so every line stands alone —
      # `set -e` and multi-line loops do not carry across, and a bare
      # `pkill -f sild-dev` matches its own shell and kills it.
      #
      # The emulator needs `-f`: `pkill -x` compares the process NAME, which the
      # kernel truncates to 15 characters, and "qemu-system-x86_64" is 18 — an `-x`
      # match is silently impossible, which is why the emulator survived and the
      # action's own teardown then burned the step's whole budget. The pattern is
      # bracketed so it does not match the `sh -c` running it.
      - name: Run instrumented E2E
        id: android_e2e
        continue-on-error: true
        timeout-minutes: 12
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: "5"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: sdks/kotlin
          script: |
            ./gradlew :sample:connectedDebugAndroidTest && touch /tmp/android-e2e-passed
            pkill -x sild-dev || true
            pkill -9 -f '[q]emu-system-x86_64' || true

      # connectedAndroidTest prints only "Starting N tests"/"Finished N tests", so a
      # run that takes minutes looks like a hang. The runner writes a JUnit XML per
      # device; print it so the log names every test, its outcome and its duration.
      - name: Instrumented test results
        if: always()
        run: |
          shopt -s globstar nullglob
          xml=(sdks/kotlin/sample/build/outputs/androidTest-results/**/*.xml)
          if [ ${#xml[@]} -eq 0 ]; then
            echo "no instrumented test results were written — the run did not reach the tests"
            exit 0
          fi
          python3 - "${xml[@]}" <<'PY'
          import sys, xml.etree.ElementTree as ET
          total = failed = 0
          for path in sys.argv[1:]:
              suite = ET.parse(path).getroot()
              print(f"{suite.get('name')} on {suite.get('hostname') or 'device'}")
              for case in suite.iter("testcase"):
                  bad = [k for k in ("failure", "error") for _ in case.iter(k)]
                  total += 1
                  failed += bool(bad)
                  mark = "FAIL" if bad else "ok"
                  print(f"  {mark:4} {case.get('classname')}.{case.get('name')} ({case.get('time')}s)")
                  for kind in ("failure", "error"):
                      for node in case.iter(kind):
                          print("       " + (node.get("message") or kind))
          print(f"{total} tests, {failed} failed")
          PY

      # The real gate: teardown flakiness cannot make a red suite look green,
      # and cannot make a green suite look red.
      - name: Assert instrumented E2E passed
        run: |
          if [ ! -f /tmp/android-e2e-passed ]; then
            echo "::error::instrumented tests did not pass"
            cat /tmp/sild-dev.log || true
            exit 1
          fi
          echo "instrumented tests passed"

      # The HTML report and logcat are what you actually need when a device test
      # fails, and they are gone once the runner is reclaimed.
      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-report
          path: |
            sdks/kotlin/sample/build/outputs/androidTest-results/**
            sdks/kotlin/sample/build/reports/androidTests/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump sild-dev log on failure
        if: failure()
        run: cat /tmp/sild-dev.log
