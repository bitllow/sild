# The sample app, its XCUITest and the package's own tests — targets SwiftPM cannot
# express. Generate the .xcodeproj with `xcodegen generate`; it is not committed.
name: SildSample
options:
  bundleIdPrefix: io.sild
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Sild:
    # The manifest is at the repo root, and package paths are written relative to the
    # generated .xcodeproj (which lands beside this spec).
    path: ../..

targets:
  SildSample:
    type: application
    platform: iOS
    sources: [Sample/Sources, Sample/Shared]
    info:
      path: Sample/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Acme Rides
        # The dev server is plain http on localhost.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSPhotoLibraryUsageDescription: Attach a photo to your support conversation.
    dependencies:
      - package: Sild
        product: Sild

  SildSampleUITests:
    type: bundle.ui-testing
    platform: iOS
    # Sample/Shared carries DevBackend, so the test drives the same dev endpoints and
    # trip reference the app does rather than restating them.
    sources: [Sample/UITests, Sample/Shared]
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SildSample
      - package: Sild
        product: Sild

  # The package's own tests (transport seams, state bridge, REST smoke).
  SildUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/SildTests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: Sild
        product: Sild

schemes:
  SildSample:
    build:
      targets:
        SildSample: all
        SildUnitTests: [test]
        SildSampleUITests: [test]
    test:
      targets: [SildUnitTests, SildSampleUITests]
