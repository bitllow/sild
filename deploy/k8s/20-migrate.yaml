# Schema migration (AutoMigrate then exit). The ONLY thing that changes the
# schema — no serving binary migrates (ARCHITECTURE §4). `make deploy` /
# `make update PACKAGE=backend` delete+recreate it against the freshly pushed
# image and WAIT for it before rolling the services, so the new schema is in
# place first and the old release meets it while still running. ttl cleans up
# the finished pod.
apiVersion: batch/v1
kind: Job
metadata:
  name: sild-migrate
  namespace: sild
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels: { app: sild-migrate }
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z sild-postgres 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: sild-migrate
          image: dmitri896/sild:backend
          imagePullPolicy: Always
          command: ["/usr/local/bin/sild-migrate"]
          envFrom:
            - configMapRef: { name: sild-config }
            - secretRef: { name: sild-secrets }
