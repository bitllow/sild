# REST API (§4) — stateless; publishes realtime events to Redis after each write.
# Reachable at https://api.sild.bitllow.com and in-cluster at sild-api:8080.
# Attachments go direct to the bucket (§11), so this pod holds no object bytes and
# scales freely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sild-api
  namespace: sild
spec:
  replicas: 1
  selector:
    matchLabels: { app: sild-api }
  template:
    metadata:
      labels: { app: sild-api }
    spec:
      containers:
        - name: sild-api
          image: dmitri896/sild:backend
          imagePullPolicy: Always
          command: ["/usr/local/bin/sild-api"]
          envFrom:
            - configMapRef: { name: sild-config }
            - secretRef: { name: sild-secrets }
          env:
            - { name: SILD_HTTP_ADDR, value: ":8080" }
          ports:
            - { containerPort: 8080, name: http }
          readinessProbe:
            httpGet: { path: /.well-known/jwks.json, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: sild-api
  namespace: sild
spec:
  selector: { app: sild-api }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
