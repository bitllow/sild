# The whole backend in one process (§3a packaging): REST + /v1/ws + /v1/ws/sse on
# :8080, with the webhook relay and archive sweep in-process and lease-guarded.
# Replaces 30-api / 31-ws / 32-worker; 20-migrate still owns the schema (§4).
#
# Attachments and archives go to the bucket in 05-config.yaml, so every replica
# reads what any other wrote and scaling needs no storage change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sild-standalone
  namespace: sild
spec:
  replicas: 1
  selector:
    matchLabels: { app: sild-standalone }
  template:
    metadata:
      labels: { app: sild-standalone }
    spec:
      containers:
        - name: sild-standalone
          image: dmitri896/sild:backend
          imagePullPolicy: Always
          command: ["/usr/local/bin/sild-standalone"]
          envFrom:
            - configMapRef: { name: sild-config }
            - secretRef: { name: sild-secrets }
          env:
            - { name: GOOGLE_APPLICATION_CREDENTIALS, value: /var/secrets/gcs/key.json }
            - { name: SILD_HTTP_ADDR, value: ":8080" }
            # Safe on any replica count: both are lease-guarded. "" serves only.
            - { name: SILD_JOBS, value: "webhook,archive" }
          ports:
            - { containerPort: 8080, name: http }
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - { name: gcs-key, mountPath: /var/secrets/gcs, readOnly: true }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 768Mi }
      volumes:
        - name: gcs-key
          secret: { secretName: sild-gcs-key }

---
apiVersion: v1
kind: Service
metadata:
  name: sild-standalone
  namespace: sild
spec:
  selector: { app: sild-standalone }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
