# Shared backend configuration. Every backend Deployment (api, ws, worker, mail,
# migrate) loads this ConfigMap + Secret via envFrom; per-service knobs (listen
# addr, storage dir) are set inline on each Deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sild-config
  namespace: sild
data:
  SILD_ENV: "production"
  DB_DRIVER: "postgres"
  SILD_BROKER: "redis"
  SILD_REDIS_URL: "redis://sild-redis:6379"
  # Attachments and archived conversations (§11, §12) go to one bucket every
  # process can reach. api, mail and worker all write objects, so node-local
  # storage strands whichever of them wrote them.
  STORAGE_BACKEND: "gcs"
  STORAGE_BUCKET: "please-change-me-sild-uploads"
  # Base URL for local-backend signed links (§11). Unused with STORAGE_BACKEND=gcs;
  # the demo pod is the only local-backend consumer left.
  STORAGE_PUBLIC_URL: "https://api.sild.bitllow.com"
  # JWT issuer advertised in the JWKS + minted tokens.
  SILD_JWT_ISSUER: "https://api.sild.bitllow.com"
  # Email ingest (§6.2): orgs forward support mail to <token>@mail.sild.bitllow.com.
  SILD_EMAIL_INBOUND_DOMAIN: "mail.sild.bitllow.com"
  SILD_SMTP_FROM: "support@mail.sild.bitllow.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: sild-secrets
  namespace: sild
type: Opaque
stringData:
  POSTGRES_USER: "please-change-me"
  POSTGRES_PASSWORD: "please-change-me"
  POSTGRES_DB: "please-change-me"
  # Consumed by the backend binaries. Matches the postgres Deployment below.
  DB_DSN: "host=sild-postgres port=5432 user=please-change-me1 password=please-change-me2 dbname=please-change-me3"
