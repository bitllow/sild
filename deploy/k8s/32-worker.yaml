# Background jobs (§6.1 webhook relay, §12 archive, §5.5 push nudges). No inbound ports.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sild-worker
  namespace: sild
spec:
  replicas: 1
  selector:
    matchLabels: { app: sild-worker }
  template:
    metadata:
      labels: { app: sild-worker }
    spec:
      containers:
        - name: sild-worker
          image: dmitri896/sild:backend
          imagePullPolicy: Always
          # No -jobs: the default is every job, so a new one needs no edit here.
          command: ["/usr/local/bin/sild-worker"]
          envFrom:
            - configMapRef: { name: sild-config }
            - secretRef: { name: sild-secrets }
          env:
            - { name: GOOGLE_APPLICATION_CREDENTIALS, value: /var/secrets/gcs/key.json }
          volumeMounts:
            - { name: gcs-key, mountPath: /var/secrets/gcs, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: gcs-key
          secret: { secretName: sild-gcs-key }
