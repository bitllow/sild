# Sild, standalone: the whole backend in one process, plus what it needs to be
# correct — Postgres, Redis — and the inbox UI. See docs/deployment.md.
#
#   docker compose -f deploy/standalone/compose.yaml up --build
#   open http://localhost:3000     # inbox; sign in with the bootstrap owner below
#
# Scaling changes nothing in this file: `up -d --scale sild=3`, then put your own
# load balancer over the host ports from the range below.
name: sild

x-backend-env: &backend-env
  SILD_ENV: production
  DB_DRIVER: postgres
  DB_DSN: host=postgres port=5432 user=sild password=sild dbname=sild sslmode=disable
  SILD_BROKER: redis
  SILD_REDIS_URL: redis://redis:6379
  # One named volume, so STORAGE_LOCAL_SHARED is true here (§11). Across hosts or
  # on a PaaS, switch to STORAGE_BACKEND=gcs/s3.
  STORAGE_BACKEND: local
  STORAGE_LOCAL_DIR: /data/uploads
  STORAGE_LOCAL_SHARED: "true"
  STORAGE_PUBLIC_URL: http://localhost:8080
  # Change this: it signs upload URLs, and every replica must agree on it.
  STORAGE_SIGNING_KEY: please-change-me
  # Seals tenant push credentials at rest (§5.5). Production will not start
  # without it. Generate with: openssl rand -base64 32
  SILD_SECRETS_KEY: cGxlYXNlLWNoYW5nZS1tZS0zMi1ieXRlLWtleS0xMjM=
  SILD_JWT_ISSUER: http://localhost:8080

services:
  # Schema owner: the only process that migrates (ARCHITECTURE §4). It runs to
  # completion before `sild` starts, because no serving container will migrate —
  # and none of them detects a schema that was never migrated either.
  migrate:
    build:
      context: ../..
      dockerfile: deploy/backend.Dockerfile
    command: ["/usr/local/bin/sild-migrate"]
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  sild:
    build:
      context: ../..
      dockerfile: deploy/backend.Dockerfile
    command: ["/usr/local/bin/sild-standalone"]
    environment:
      <<: *backend-env
      # REST + /v1/ws + /v1/ws/sse on this one port.
      SILD_HTTP_ADDR: ":8080"
      # SILD_JOBS unset runs every job, which is lease-guarded and so safe at any
      # replica count. Set it to "" for a replica that only serves.
      # First run only, while the database is empty. Prefer sild-admin.
      SILD_BOOTSTRAP_TENANT: Acme
      SILD_BOOTSTRAP_ADMIN_EMAIL: admin@acme.test
      SILD_BOOTSTRAP_ADMIN_NAME: Acme Owner
      SILD_BOOTSTRAP_ADMIN_PASSWORD: please-change-me
    ports:
      # A range, not a fixed port: --scale needs one host port per replica.
      - "8080-8090:8080"
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  inbox:
    build:
      context: ../..
      dockerfile: deploy/inbox.Dockerfile
      # Next inlines NEXT_PUBLIC_* into the client bundle and resolves the /v1
      # proxy target during `next build`, so both are build args, not env.
      args:
        # Server-side: same-origin /v1 for the first-party admin cookie.
        SILD_API_URL: http://sild:8080
        # Browser-side: the realtime listener is the standalone port itself.
        NEXT_PUBLIC_SILD_WS_URL: ws://localhost:8080/v1/ws
    ports:
      - "3000:3000"
    depends_on:
      - sild

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sild
      POSTGRES_PASSWORD: sild
      POSTGRES_DB: sild
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sild"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

volumes:
  pgdata:
  uploads:
